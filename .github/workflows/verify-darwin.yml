name: Verify darwin

# Answers whether a build run's unsigned macOS payload runs once downloaded.
# A fresh runner fetches the archive programmatically (no quarantine
# attribute), checks every Mach-O signature and loads each one that fails,
# then quarantines the tree the way a browser download does and asks
# Gatekeeper. Findings go to the job summary; only an unrunnable payload
# after a programmatic download fails the job.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run whose darwin artifacts to verify'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: verify ${{ matrix.target.label }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: darwin-arm64
            runner: macos-15
          - label: darwin-x64
            runner: macos-15-intel
    env:
      TARGET: ${{ matrix.target.label }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: hermes-agent-*-${{ matrix.target.label }}
          merge-multiple: true
          path: ${{ runner.temp }}/download

      - name: Check and extract the archive
        shell: bash
        run: |
          cd "$RUNNER_TEMP/download"
          archive=$(ls hermes-agent-*-"$TARGET".tar.gz)
          shasum -a 256 -c "$archive.sha256"
          payload="$RUNNER_TEMP/payload"
          mkdir -p "$payload"
          tar -xzf "$archive" -C "$payload"
          {
            echo "PAYLOAD=$payload"
            echo "LAUNCHER=$payload/$(jq -r .runtime.commands.hermes "$payload/manifest.json")"
            echo "STORE_PYTHON=$payload/$(jq -r .runtime.storePython "$payload/manifest.json")"
            echo "HOME=$RUNNER_TEMP/home"
            echo "HERMES_HOME=$RUNNER_TEMP/home/.hermes"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/home"
          echo "## $TARGET — \`$archive\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run after a programmatic download
        shell: bash
        run: |
          quarantined=$(xattr -rl "$PAYLOAD" | grep -c com.apple.quarantine || true)
          version=$("$LAUNCHER" --version | head -1)
          {
            echo "### Programmatic download"
            echo "| | |"
            echo "|---|---|"
            echo "| Gatekeeper | $(spctl --status 2>&1) |"
            echo "| Files carrying quarantine | $quarantined |"
            echo "| \`hermes --version\` | ran: $version |"
          } >> "$GITHUB_STEP_SUMMARY"

      # codesign --verify alone over-reports: a framework's inner binary is
      # sealed by its bundle, and a slice for another architecture never runs
      # here. Each failing library is therefore loaded in its own process —
      # the kernel kills one whose signature it rejects.
      - name: Check native code signatures
        shell: bash
        run: |
          host=$(uname -m)
          total=0; signed=0; foreign=0; loaded=0; killed=0; other=0
          : > "$RUNNER_TEMP/findings.txt"
          while IFS= read -r -d '' file; do
            kind=$(file -b "$file")
            case "$kind" in Mach-O*) ;; *) continue ;; esac
            total=$((total + 1))
            if codesign --verify "$file" 2>/dev/null; then signed=$((signed + 1)); continue; fi
            reason=$(codesign --verify "$file" 2>&1 | tail -1 | sed "s|^$file: ||")
            name=${file#"$PAYLOAD"/}
            if ! lipo -archs "$file" 2>/dev/null | tr ' ' '\n' | grep -qx "$host"; then
              foreign=$((foreign + 1)); echo "foreign arch ($(lipo -archs "$file")): $name" >> "$RUNNER_TEMP/findings.txt"; continue
            fi
            case "$kind" in
              *executable*) other=$((other + 1)); echo "executable, $reason: $name" >> "$RUNNER_TEMP/findings.txt"; continue ;;
            esac
            status=0
            "$STORE_PYTHON" -I -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' "$file" \
              > /dev/null 2> "$RUNNER_TEMP/load.err" || status=$?
            error=$(tail -1 "$RUNNER_TEMP/load.err")
            if [ "$status" -eq 0 ]; then
              loaded=$((loaded + 1)); echo "loads despite \"$reason\": $name" >> "$RUNNER_TEMP/findings.txt"
            elif [ "$status" -ge 128 ]; then
              killed=$((killed + 1)); echo "KILLED (signal $((status - 128))), $reason: $name" >> "$RUNNER_TEMP/findings.txt"
            else
              other=$((other + 1)); echo "load error ($error), $reason: $name" >> "$RUNNER_TEMP/findings.txt"
            fi
          done < <(find "$PAYLOAD" -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.node' -o -perm +111 \) -print0)
          apps=""
          while IFS= read -r -d '' app; do
            case "$app" in *.app/*) continue ;; esac
            verdict=$(codesign --verify --deep --strict "$app" 2>&1 | tail -1)
            apps="$apps<br>\`${app#"$PAYLOAD"/}\`: ${verdict:-valid}"
          done < <(find "$PAYLOAD" -type d -name '*.app' -print0)
          {
            echo "### Native code ($host)"
            echo "| | |"
            echo "|---|---|"
            echo "| Mach-O files | $total |"
            echo "| Signature valid | $signed |"
            echo "| Failing, other architecture only | $foreign |"
            echo "| Failing, loads anyway | $loaded |"
            echo "| Failing, killed on load | $killed |"
            echo "| Failing, other (executable or load error) | $other |"
            echo "| App bundles | ${apps#<br>} |"
            echo
            echo "<details><summary>Failing files</summary>"
            echo
            echo '```'
            sort "$RUNNER_TEMP/findings.txt"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # What a browser download extracted by Archive Utility leaves: every
      # file quarantined. Reported, never gated — the answer is the finding.
      - name: Run after a browser download (quarantined)
        shell: bash
        run: |
          chmod -R u+w "$PAYLOAD"
          xattr -rw com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$PAYLOAD"
          assess=$(spctl --assess --type execute -vv "$LAUNCHER" 2>&1 || true)
          status=0
          perl -e 'alarm 60; exec @ARGV' "$LAUNCHER" --version > "$RUNNER_TEMP/run.out" 2>&1 || status=$?
          output=$(tail -1 "$RUNNER_TEMP/run.out")
          if [ "$status" -eq 0 ]; then ran="ran: $output"; else ran="failed (exit $status): $output"; fi
          {
            echo "### Browser download (quarantined)"
            echo "| | |"
            echo "|---|---|"
            echo "| \`spctl --assess\` | ${assess//$'\n'/ } |"
            echo "| \`hermes --version\` | $ran |"
          } >> "$GITHUB_STEP_SUMMARY"
