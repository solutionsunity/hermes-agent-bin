name: Build

# Builds the standalone Hermes CLI payload for each (os, arch) target from a
# NousResearch/hermes-agent tag, with Hermes' own command: native_build.py
# prepares then assembles the payload, smoke-payload.sh boots it relocated.
# Staging is native per target — the runner IS the target — on GitHub-hosted
# runners only. Each target uploads its archive and .sha256 as a proof build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'NousResearch/hermes-agent tag to build (e.g. v0.22.5)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target.label }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: linux-x64
            runner: ubuntu-24.04
          - label: linux-arm64
            runner: ubuntu-24.04-arm
          - label: darwin-arm64
            runner: macos-15
          - label: darwin-x64
            runner: macos-15-intel
          - label: win32-x64
            runner: windows-2025
          - label: win32-arm64
            runner: windows-11-arm
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ matrix.target.label }}
      # Outside the checkout: preparation admits only a clean source tree.
      PAYLOAD: ${{ runner.temp }}/agent-payload
      PAYLOAD_WORK: ${{ runner.temp }}/payload-job
      PAYLOAD_CACHE: ${{ runner.temp }}/payload-inputs
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ inputs.tag }}
          fetch-tags: true
          persist-credentials: false

      # The bootstrap scripts need Python >= 3.11 (tomllib).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Prepare native payload dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then bootstrap=python; else bootstrap=python3; fi
          "$bootstrap" -S -B scripts/bundles/native_build.py --prepare-only \
            --source "$GITHUB_WORKSPACE" --work "$PAYLOAD_WORK" --cache "$PAYLOAD_CACHE" \
            --out "$PAYLOAD" --ref HEAD

      - name: Assemble the prepared payload without dependency acquisition
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then bootstrap=python; else bootstrap=python3; fi
          "$bootstrap" -S -B scripts/bundles/native_build.py --prepared "$PAYLOAD.prepared.json"

      - name: Smoke test the relocated payload (network disabled)
        if: startsWith(matrix.target.label, 'linux-')
        shell: bash
        run: sudo --preserve-env=PATH unshare --net bash scripts/smoke-payload.sh "$PAYLOAD"

      - name: Smoke test the relocated payload (native launchers)
        if: ${{ !startsWith(matrix.target.label, 'linux-') }}
        shell: bash
        run: bash scripts/smoke-payload.sh "$PAYLOAD"

      # The payload's contents sit at the archive root, so manifest.json's
      # relative launcher paths hold from the extraction directory.
      - name: Archive the payload
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then python=python; else python=python3; fi
          launcher=$("$python" -c 'import json,sys; print(json.load(open(sys.argv[1]))["runtime"]["commands"]["hermes"])' "$PAYLOAD/manifest.json")
          mkdir -p dist
          name="hermes-agent-$TAG-$TARGET"
          if [ "$RUNNER_OS" = Windows ]; then
            archive="$name.zip"
            # bsdtar, not Git Bash's GNU tar: -a picks zip (zip64) from the name.
            "$SYSTEMROOT/System32/tar.exe" -a -c -f "dist/$archive" -C "$PAYLOAD" .
          else
            archive="$name.tar.gz"
            tar -czf "dist/$archive" -C "$PAYLOAD" .
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$archive"; else shasum -a 256 "$archive"; fi > "$archive.sha256"
          {
            echo "### $TARGET"
            echo "| | |"
            echo "|---|---|"
            echo "| Hermes | \`$TAG\` @ \`$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)\` |"
            echo "| Payload on disk | $(du -sh "$PAYLOAD" | cut -f1) |"
            echo "| Archive | \`$archive\` — $(du -h "$archive" | cut -f1) ($(wc -c < "$archive" | tr -d ' ') bytes) |"
            echo "| sha256 | \`$(cut -d' ' -f1 "$archive.sha256")\` |"
            echo "| Launcher | \`$launcher\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-agent-${{ inputs.tag }}-${{ matrix.target.label }}
          path: dist/
          # Already compressed; the artifact zip only carries it.
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  # Answers whether an unsigned macOS payload runs once downloaded: a fresh
  # runner fetches the archive programmatically (no quarantine attribute),
  # checks every Mach-O signature, runs it, then simulates a browser download
  # by quarantining a copy and asks Gatekeeper.
  darwin-verify:
    name: verify ${{ matrix.target.label }} download
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: darwin-arm64
            runner: macos-15
          - label: darwin-x64
            runner: macos-15-intel
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ matrix.target.label }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hermes-agent-${{ inputs.tag }}-${{ matrix.target.label }}
          path: ${{ runner.temp }}/download

      - name: Check, extract and run the downloaded payload
        shell: bash
        run: |
          archive="hermes-agent-$TAG-$TARGET.tar.gz"
          cd "$RUNNER_TEMP/download"
          shasum -a 256 -c "$archive.sha256"
          payload="$RUNNER_TEMP/payload"
          mkdir -p "$payload"
          tar -xzf "$archive" -C "$payload"
          quarantined=$(xattr -rl "$payload" | grep -c com.apple.quarantine || true)
          machos=0; invalid=0
          while IFS= read -r -d '' file; do
            file -b "$file" | grep -q '^Mach-O' || continue
            machos=$((machos + 1))
            if ! codesign --verify "$file" 2>/dev/null; then
              invalid=$((invalid + 1))
              echo "invalid or missing signature: ${file#"$payload"/}"
            fi
          done < <(find "$payload" -type f -print0)
          launcher="$payload/$(jq -r .runtime.commands.hermes "$payload/manifest.json")"
          home="$RUNNER_TEMP/home"; mkdir -p "$home"
          HOME="$home" HERMES_HOME="$home/.hermes" "$launcher" --version
          {
            echo "### $TARGET — programmatic download"
            echo "| | |"
            echo "|---|---|"
            echo "| Gatekeeper | $(spctl --status 2>&1) |"
            echo "| Files carrying quarantine | $quarantined |"
            echo "| Mach-O files | $machos |"
            echo "| Without a valid signature | $invalid |"
            echo "| \`hermes --version\` | ran |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "LAUNCHER=$launcher" >> "$GITHUB_ENV"

      # What Archive Utility leaves after a browser download: every file
      # quarantined. Reported, not gated — the answer is the finding.
      - name: Simulate a browser download (quarantined)
        shell: bash
        run: |
          home="$RUNNER_TEMP/home"
          xattr -rw com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$RUNNER_TEMP/payload"
          assess=$(spctl --assess --type execute -vv "$LAUNCHER" 2>&1 || true)
          if HOME="$home" HERMES_HOME="$home/.hermes" perl -e 'alarm 60; exec @ARGV' "$LAUNCHER" --version; then
            ran=ran
          else
            ran="failed (exit $?)"
          fi
          {
            echo "### $TARGET — quarantined copy"
            echo "| | |"
            echo "|---|---|"
            echo "| \`spctl --assess\` | ${assess//$'\n'/ } |"
            echo "| \`hermes --version\` | $ran |"
          } >> "$GITHUB_STEP_SUMMARY"
